# Link checker for The Grid
#
# Scheduled and manual runs check every link in every Markdown file,
# and open an issue if anything is broken.
#
# Pull requests check only the links in Markdown files that the pull
# request changed, and fail the check if anything is broken. This keeps
# request volume low while still blocking new broken links. Pull requests
# that change no Markdown files pass without checking anything.
#
# Actions are pinned to exact commit SHAs, with the version in a comment.
# A tag like @v7 can be moved by the action's owner; a SHA can't.
# Dependabot updates both the SHA and the comment.

name: Check links

on:
  schedule:
    - cron: "0 13 1 * *"   # 1st of every month, 13:00 UTC
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab
  pull_request:              # runs on every pull request, as a required check

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history, so a pull request can be compared to main

      # Decide what to check: everything (scheduled/manual) or only the
      # Markdown files this pull request changed.
      - name: Choose files to check
        id: files
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "targets='./**/*.md'" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only --diff-filter=d "origin/$BASE_REF...HEAD" -- '*.md')

          if [ -z "$files" ]; then
            echo "No Markdown files changed. Nothing to check."
            exit 0
          fi

          # Safety: only allow simple file names, since they're passed to the
          # link checker as arguments. Blocks crafted names in outside pull requests.
          if echo "$files" | grep -qvE '^[A-Za-z0-9 ./_-]+$'; then
            echo "Unexpected characters in a changed file name. Stopping."
            exit 1
          fi

          targets=""
          while IFS= read -r f; do
            targets="$targets '$f'"
          done <<< "$files"

          echo "Checking: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Check links
        id: lychee
        if: steps.files.outputs.targets != ''
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: false
          args: >-
            --no-progress
            --scheme https --scheme http
            --accept '200..=299,403,429'
            --max-concurrency 4
            --max-retries 2
            --exclude 'acq\.osd\.mil'
            ${{ steps.files.outputs.targets }}

      - name: Open an issue if links are broken (scheduled and manual runs)
        if: steps.files.outputs.targets != '' && steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Broken links found $(date +%Y-%m-%d)" --body-file ./lychee/out.md

      - name: Fail the check if links are broken (pull requests)
        if: steps.files.outputs.targets != '' && steps.lychee.outputs.exit_code != 0 && github.event_name == 'pull_request'
        run: |
          echo "Broken links found. See the job summary for details."
          exit 1
